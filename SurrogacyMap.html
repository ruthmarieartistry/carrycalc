        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            populateStateDropdown();
            renderStateGrid();
            attachEventListeners();
        });

        // Populate state dropdown
        function populateStateDropdown() {
            const select = document.getElementById('stateSelect');
            const states = Object.keys(surrogacyData.states).sort((a, b) => {
                return surrogacyData.states[a].name.localeCompare(surrogacyData.states[b].name);
            });

            states.forEach(code => {
                const state = surrogacyData.states[code];
                const option = document.createElement('option');
                option.value = code;
                option.textContent = state.name;
                select.appendChild(option);
            });
        }

        // Render state grid
        function renderStateGrid(filters = {}) {
            const grid = document.getElementById('stateGrid');
            grid.innerHTML = '';

            const stateCodes = Object.keys(surrogacyData.states).sort((a, b) => {
                return surrogacyData.states[a].name.localeCompare(surrogacyData.states[b].name);
            });

            stateCodes.forEach(code => {
                const state = surrogacyData.states[code];

                // Apply filters
                if (filters.legalStatus && filters.legalStatus.length > 0) {
                    if (!filters.legalStatus.includes(state.legal_status)) return;
                }

                if (filters.preBirth && (state.pre_birth_orders === "No" || state.pre_birth_orders === "N/A")) return;
                if (filters.sameSex && (state.same_sex_couples === "No" || state.same_sex_couples === "N/A" || state.same_sex_couples === "Limited")) return;
                if (filters.single && (state.single_parents === "No" || state.single_parents === "N/A" || state.single_parents === "Limited")) return;
                if (filters.international && (state.international_ips === "No" || state.international_ips === "N/A" || state.international_ips === "Not recommended")) return;

                const card = document.createElement('div');
                card.className = 'state-card';
                card.onclick = () => selectState(code);

                card.innerHTML = `
                    <h3>${state.name}</h3>
                    <div class="rating">${state.rating}</div>
                    <div class="status">${state.legal_status}</div>
                `;

                grid.appendChild(card);
            });

            if (grid.children.length === 0) {
                grid.innerHTML = '<div class="no-results">No states match the selected filters</div>';
            }
        }

        // Select state
        function selectState(stateCode) {
            const select = document.getElementById('stateSelect');
            select.value = stateCode;
            showStateDetails(stateCode);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Show state details
        function showStateDetails(stateCode) {
            const state = surrogacyData.states[stateCode];
            const resultsCard = document.getElementById('resultsCard');

            const statusClass = getStatusClass(state.legal_status);

            resultsCard.innerHTML = `
                <div class="state-header">
                    <div class="state-title">
                        <span>${state.name}</span>
                        <span class="rating">${state.rating}</span>
                    </div>
                    <span class="status-badge ${statusClass}">${state.legal_status}</span>
                </div>

                <div class="summary-section">
                    <h2>Summary</h2>
                    <p>${state.summary}</p>
                </div>

                <div class="info-grid">
                    <div class="info-item">
                        <h3>Compensated Surrogacy</h3>
                        <p>${state.compensated_surrogacy}</p>
                    </div>
                    <div class="info-item">
                        <h3>Pre-birth Orders</h3>
                        <p>${state.pre_birth_orders}</p>
                    </div>
                    <div class="info-item">
                        <h3>Same-sex Couples</h3>
                        <p>${state.same_sex_couples}</p>
                    </div>
                    <div class="info-item">
                        <h3>Single Parents</h3>
                        <p>${state.single_parents}</p>
                    </div>
                    <div class="info-item">
                        <h3>International IPs</h3>
                        <p>${state.international_ips}</p>
                    </div>
                </div>

                ${state.statute !== "No specific statute" ? `
                <div class="statute-box">
                    <h3>Legal Reference</h3>
                    <p>${state.statute}</p>
                </div>
                ` : ''}

                <div class="key-points">
                    <h2>Key Points</h2>
                    <ul>
                        ${state.key_points.map(point => `<li>${point}</li>`).join('')}
                    </ul>
                </div>
            `;

            resultsCard.classList.add('active');
        }

        // Get status class
        function getStatusClass(status) {
            if (status === "Surrogacy-Friendly") return "status-friendly";
            if (status === "Permitted with Restrictions") return "status-restricted";
            if (status === "Unclear/No Statute") return "status-unclear";
            if (status === "Prohibited") return "status-prohibited";
            return "";
        }

        // Attach event listeners
        function attachEventListeners() {
            document.getElementById('stateSelect').addEventListener('change', function(e) {
                if (e.target.value) {
                    showStateDetails(e.target.value);
                }
            });

            // Filter checkboxes
            const filterCheckboxes = document.querySelectorAll('.filter-option input[type="checkbox"]');
            filterCheckboxes.forEach(checkbox => {
                checkbox.addEventListener('change', applyFilters);
            });
        }

        // Apply filters
        function applyFilters() {
            const filters = {
                legalStatus: [],
                preBirth: false,
                sameSex: false,
                single: false,
                international: false
            };

            // Legal status filters
            if (document.getElementById('filterFriendly').checked) {
                filters.legalStatus.push('Surrogacy-Friendly');
            }
            if (document.getElementById('filterRestricted').checked) {
                filters.legalStatus.push('Permitted with Restrictions');
            }
            if (document.getElementById('filterUnclear').checked) {
                filters.legalStatus.push('Unclear/No Statute');
            }
            if (document.getElementById('filterProhibited').checked) {
                filters.legalStatus.push('Prohibited');
            }

            // Requirement filters
            filters.preBirth = document.getElementById('filterPreBirth').checked;
            filters.sameSex = document.getElementById('filterSameSex').checked;
            filters.single = document.getElementById('filterSingle').checked;
            filters.international = document.getElementById('filterInternational').checked;

            renderStateGrid(filters);
        }
    </script>
